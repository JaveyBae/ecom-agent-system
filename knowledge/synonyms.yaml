# 口语说法 → 法规用语，用于 BM25 的查询扩展。
#
# 查询里出现左边的说法时，把右边的法规用语追加到 BM25 的查询词里。文档不改，向量检索
# 也不扩展：向量模型本身能理解近义说法，BM25 只认字面。
#
# 这张表按电商售后里常见的说法整理，不是对着评测题逐条补的词。右边的每个词都必须在
# 语料里出现过，左右不能相同，tests/test_synonyms.py 会检查。

