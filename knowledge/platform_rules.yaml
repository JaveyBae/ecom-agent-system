# ShopSim 模拟商城平台规则（草案）
#
# 这是虚构平台的规则，参照常见行业做法自拟，不复制、也不代表任何真实平台的规则。
# 这个文件是平台规则的唯一来源：
#   - 规则文本由 text 模板和 params 渲染，给知识库检索用
#   - params 同时给 harness 的代码检查和任务生成器计算标准答案用
# 改数值只改 params，文本会跟着变，三处不会不一致。
#
# 约定：
#   - text 里的 {name} 必须在 params 里有定义，params 里的每个值也必须出现在 text 里
#   - legal_basis 里的条文必须在法规知识库里存在（build_platform_rules.py 会检查）
#   - text 里提到的其他规则编号（如 P-MEM-01）必须存在
#   - 平台规则可以比法律对消费者更有利，不能更不利
#
# 标了“待定”的数值是设计选择，不是法律要求，可以按需要调整。

platform: ShopSim 模拟商城
title: ShopSim 模拟商城平台规则
version: v0.1-draft
updated: "2026-10-23"
tiers: [普通, 黄金, 铂金, 钻石]  # 与 ShopSimulator 用户画像里的会员等级一致
zones: [同城, 江浙沪, 一般, 偏远]

rules:
  # ---------------------------------------------------------------- 七天无理由退货
  - id: P-RET-01
    category: 七天无理由退货
    title: 退货期限
    text: |-
      消费者可以自签收商品的次日起{return_days}日内申请七天无理由退货。
      签收时间以物流签收记录为准。会员享有更长的退货期限，见 P-MEM-01。
    params:
      return_days: 7
    legal_basis:
      - 《中华人民共和国消费者权益保护法》第二十五条
      - 《网络购买商品七日无理由退货暂行办法》第十条
      - 《中华人民共和国电子商务法》第五十一条

  - id: P-RET-02
    category: 七天无理由退货
    title: 不适用七天无理由退货的商品
    text: |-
      下列商品不适用七天无理由退货：消费者定作的商品；鲜活易腐的商品；在线下载或者已拆封的音像制品、计算机软件等数字化商品；已交付的报纸、期刊。
      此外，拆封后易影响人身安全或者商品品质的商品（如食品、化妆品、贴身衣物）、激活或者试用后价值明显贬损的商品（如已激活的手机、平板电脑）、销售时已明示的临期或者有瑕疵的商品，商家可以在商品页显著标注“不支持七天无理由退货”，经消费者下单时确认后不适用。
      商家未标注或者未经消费者确认的，不得以上述理由拒绝退货。
    legal_basis:
      - 《中华人民共和国消费者权益保护法》第二十五条
      - 《网络购买商品七日无理由退货暂行办法》第六条
      - 《网络购买商品七日无理由退货暂行办法》第七条
      - 《中华人民共和国消费者权益保护法实施条例》第十九条

  - id: P-RET-03
    category: 七天无理由退货
    title: 拆封查验不影响退货
    text: |-
      消费者为查验商品而拆开包装，或者为确认商品品质、功能进行合理调试，不影响商品原有品质、功能和外观的，视为商品完好。
      商家不得以商品“已拆封”为由拒绝七天无理由退货。
    legal_basis:
      - 《中华人民共和国消费者权益保护法实施条例》第十九条
      - 《最高人民法院关于审理网络消费纠纷案件适用法律若干问题的规定（一）》第三条
      - 《网络购买商品七日无理由退货暂行办法》第八条

  - id: P-RET-04
    category: 七天无理由退货
    title: 赠品随商品退回
    text: |-
      退货时，赠品（包括实物、积分、优惠券）应当随商品一并退回。
      赠品无法退回的，按商品页事先标明的赠品价格从退款中扣除；商品页未标明赠品价格的，不得扣除。
    legal_basis:
      - 《网络购买商品七日无理由退货暂行办法》第十二条

  - id: P-RET-05
    category: 七天无理由退货
    title: 退货运费
    text: |-
      七天无理由退货的退货运费由消费者承担，按收货地址计：偏远地区{fee_remote}元，其他地区{fee_normal}元。
      订单投保了退货运费险的，由保险赔付退货运费；黄金及以上会员免退货运费，见 P-MEM-01。
      因商品质量问题退货的，运费由商家承担，见 P-QA-01。
    params:
      fee_normal: 10  # 待定
      fee_remote: 25  # 待定
    legal_basis:
      - 《中华人民共和国消费者权益保护法》第二十五条

  - id: P-RET-06
    category: 七天无理由退货
    title: 退货申请处理时限
    text: |-
      商家应当在收到退货申请后{respond_hours}小时内同意申请并提供退货地址、联系人和联系电话；逾期未处理的，视为同意，平台自动提供退货地址。
    params:
      respond_hours: 48  # 待定
    legal_basis:
      - 《网络购买商品七日无理由退货暂行办法》第十一条

  - id: P-RET-07
    category: 七天无理由退货
    title: 退款时限
    text: |-
      商家应当在收到退回商品后{refund_days}日内完成退款；逾期未处理的，平台自动退款。
      退款按原支付方式退回；使用优惠券或者积分支付的部分，按 P-PRICE-03 处理。
    params:
      refund_days: 3  # 待定，法定上限为七日
    legal_basis:
      - 《网络购买商品七日无理由退货暂行办法》第十三条
      - 《中华人民共和国消费者权益保护法》第二十五条

  # ---------------------------------------------------------------- 质量问题
  - id: P-QA-01
    category: 质量问题
    title: 质量问题退换货
    text: |-
      商品存在质量问题的，消费者可以自签收次日起{qa_return_days}日内选择退货、换货或者维修；超过{qa_return_days}日但在{qa_exchange_days}日内的，可以选择换货或者维修，符合法定解除合同条件的仍可以退货。
      因质量问题退货、换货、维修产生的往返运费由商家承担。
    params:
      qa_return_days: 7
      qa_exchange_days: 15  # 待定
    legal_basis:
      - 《中华人民共和国消费者权益保护法》第二十四条

  - id: P-QA-02
    category: 质量问题
    title: 耐用商品瑕疵举证
    text: |-
      电视机、电冰箱、空调器、洗衣机、电脑等耐用商品，消费者自签收之日起{burden_months}个月内发现瑕疵并发生争议的，由商家承担有关瑕疵的举证责任。
    params:
      burden_months: 6  # 与法律规定一致
    legal_basis:
      - 《中华人民共和国消费者权益保护法》第二十三条

  - id: P-QA-03
    category: 质量问题
    title: 欺诈赔偿
    text: |-
      商家存在售假、虚假宣传等欺诈行为的，消费者可以要求退款，并按商品价款的{fraud_multiple}倍增加赔偿；增加赔偿的金额不足{fraud_min}元的，按{fraud_min}元赔偿。
    params:
      fraud_multiple: 3  # 与法律规定一致
      fraud_min: 500  # 与法律规定一致
    legal_basis:
      - 《中华人民共和国消费者权益保护法》第五十五条

  - id: P-QA-04
    category: 质量问题
    title: 食品安全赔偿
    text: |-
      食品不符合食品安全标准的，消费者除要求赔偿损失外，还可以要求支付价款{food_multiple}倍或者损失三倍的赔偿金；增加赔偿的金额不足{food_min}元的，按{food_min}元赔偿。
    params:
      food_multiple: 10  # 与法律规定一致
      food_min: 1000  # 与法律规定一致
    legal_basis:
      - 《中华人民共和国食品安全法》第一百四十八条

  - id: P-QA-05
    category: 质量问题
    title: 质量问题的凭证
    text: |-
      按质量问题申请退货、换货或者维修的，消费者应当说明具体问题，例如哪里破损、什么功能失灵，并提供照片或者视频；只说“质量不好”“不好用”的，不按质量问题受理，可以申请七天无理由退货。
      运输损毁、生鲜变质申请仅退款的，同样需要说明问题并提供照片。
    legal_basis: []

  # ---------------------------------------------------------------- 发货与物流
  - id: P-SHIP-01
    category: 发货与物流
    title: 发货时效
    text: |-
      商家应当在消费者付款后{ship_hours}小时内发货；预售商品按商品页承诺的时间发货。
    params:
      ship_hours: 48  # 待定
    legal_basis:
      - 《中华人民共和国电子商务法》第二十条

  - id: P-SHIP-02
    category: 发货与物流
    title: 延迟发货补偿
    text: |-
      商家超过 P-SHIP-01 规定的时效未发货的，消费者可以申请延迟发货补偿，商家按订单实付金额的{delay_rate_pct}%赔付，最低{delay_min}元，最高{delay_max}元。
      超过发货时效{delay_cancel_hours}小时仍未发货的，消费者可以取消订单并获得全额退款，延迟发货补偿照常赔付。
    params:
      delay_rate_pct: 5  # 待定
      delay_min: 5  # 待定
      delay_max: 30  # 待定
      delay_cancel_hours: 72  # 待定
    legal_basis:
      - 《中华人民共和国电子商务法》第二十条
      - 《中华人民共和国民法典》第五百七十七条

  - id: P-SHIP-03
    category: 发货与物流
    title: 虚假发货
    text: |-
      商家填写物流单号后{fake_ship_hours}小时内物流公司仍无揽收记录的，视为虚假发货，按 P-SHIP-02 的延迟发货处理。
    params:
      fake_ship_hours: 24  # 待定
    legal_basis:
      - 《中华人民共和国电子商务法》第二十条

  - id: P-SHIP-04
    category: 发货与物流
    title: 发货前取消订单
    text: |-
      商品发货前，消费者可以随时取消订单，平台立即全额退款，无需商家同意。
    legal_basis: []

  - id: P-SHIP-05
    category: 发货与物流
    title: 已发货拦截
    text: |-
      商品已发货但尚未签收的，消费者可以申请拦截，拦截成功、商品退回商家后退款。
      因消费者原因拦截的，往返运费由消费者承担，按 P-RET-05 的标准计两程，从退款中扣除；因商家原因（如发错商品、延迟发货）拦截的，由商家承担。
      拦截前包裹已经签收的，拦截失败，可以按七天无理由退货处理。
    legal_basis: []

  - id: P-SHIP-06
    category: 发货与物流
    title: 运输途中丢失或损毁
    text: |-
      商品在消费者签收前丢失、损毁或者内件短少的，由商家负责补发或者全额退款，不得要求消费者自行向物流公司索赔；商家可以依法向物流公司追偿。
    legal_basis:
      - 《中华人民共和国电子商务法》第二十条
      - 《快递暂行条例》第二十八条

  - id: P-SHIP-07
    category: 发货与物流
    title: 物流异常
    text: |-
      物流信息连续{stall_days}日未更新的，视为物流异常；收货地址属于偏远地区的，为{stall_days_remote}日。
      物流异常的，消费者可以申请补发或者全额退款，按 P-SHIP-06 处理。
    params:
      stall_days: 7  # 待定
      stall_days_remote: 12  # 待定
    legal_basis:
      - 《中华人民共和国电子商务法》第二十条

  - id: P-SHIP-08
    category: 发货与物流
    title: 承诺送达时间
    text: |-
      商家承诺的送达时间按收货地址所在区域计算，自发货次日起算：同城{eta_city}日，江浙沪{eta_jzh}日，一般地区{eta_general}日，偏远地区{eta_remote}日。
    params:
      eta_city: 2  # 待定，与物流模拟器的配送天数一致
      eta_jzh: 3  # 待定
      eta_general: 5  # 待定
      eta_remote: 10  # 待定
    legal_basis:
      - 《中华人民共和国电子商务法》第二十条

  - id: P-SHIP-09
    category: 发货与物流
    title: 投递与签收
    text: |-
      未经消费者同意，物流公司不得将包裹投递至智能快件箱、快递服务站，也不得代为签收。
      物流显示已签收但消费者未收到的，消费者可以申请核实，核实期间不计入退货期限。
    legal_basis:
      - 《快递市场管理办法》第二十八条
      - 《中华人民共和国电子商务法》第五十一条

  - id: P-SHIP-10
    category: 发货与物流
    title: 当面验收与拒收
    text: |-
      包装明显破损或者内件为易碎品的，消费者可以当面查看内件或者拒收。
      因包装破损拒收的，按运输途中损毁处理，适用 P-SHIP-06。
    legal_basis:
      - 《快递市场管理办法》第二十七条
      - 《快递暂行条例》第二十六条

  - id: P-SHIP-11
    category: 发货与物流
    title: 修改收货地址
    text: |-
      商家发货前，消费者可以修改收货地址里的详细地址（同一区县内）；要改到其他区县的，取消订单后重新下单。
      商家已经发货的不能修改地址，可以按 P-SHIP-05 申请拦截。
    legal_basis: []

  - id: P-SHIP-12
    category: 发货与物流
    title: 催发货和催派送
    text: |-
      消费者可以通过客服催促发货或者派送。催发货的，平台通知商家，商家应当在{urge_reply_hours}小时内答复预计发货时间；催派送的，平台通知物流公司优先派送。
      催促不改变发货时效和承诺送达时间；超过发货时效的，按 P-SHIP-02 处理。
    params:
      urge_reply_hours: 24  # 待定
    legal_basis: []

  # ---------------------------------------------------------------- 价格与优惠
  - id: P-PRICE-01
    category: 价格与优惠
    title: 价格保护
    text: |-
      签收后{price_protect_days}日内，同一商品同一规格在本店降价的，消费者可以申请退还差价；直播专享价、限时秒杀价不适用价格保护。
    params:
      price_protect_days: 7  # 待定
    legal_basis: []

  - id: P-PRICE-02
    category: 价格与优惠
    title: 部分退货的优惠分摊
    text: |-
      订单使用了满减、店铺优惠券或者平台优惠券，部分商品退货的，订单优惠按各商品实付金额占订单商品总额的比例分摊。
      退款金额为退货商品的实付金额减去分摊到该商品的优惠，计算结果保留到分。
    legal_basis:
      - 《网络购买商品七日无理由退货暂行办法》第十五条

  - id: P-PRICE-03
    category: 价格与优惠
    title: 优惠券和积分退还
    text: |-
      订单全部退货的，已使用的优惠券仍在有效期内的退回消费者账户，已过期的不再退回；使用积分抵扣的部分，退回等额积分。
    legal_basis:
      - 《网络购买商品七日无理由退货暂行办法》第十五条

  # ---------------------------------------------------------------- 会员
  - id: P-MEM-01
    category: 会员
    title: 会员售后权益
    text: |-
      退货期限：普通会员和黄金会员适用 P-RET-01；铂金会员为签收次日起{days_platinum}日，钻石会员为{days_diamond}日。
      退货运费：黄金及以上会员七天无理由退货免退货运费。
      极速退款：铂金会员和钻石会员申请七天无理由退货并填写退货物流单号后，平台先行退款。
    params:
      days_platinum: 15  # 待定
      days_diamond: 30  # 待定
    legal_basis: []

  - id: P-MEM-02
    category: 会员
    title: 会员权益不因规则修改而减少
    text: |-
      会员有效期内，平台修改规则不得减少已购会员的权益，也不得额外收费；与会员权益相关的规则变化，应当在消费者续费前以显著方式告知。
    legal_basis:
      - 《网络交易平台规则监督管理办法》第三十二条

  # ---------------------------------------------------------------- 特殊品类
  - id: P-CAT-01
    category: 特殊品类
    title: 定制商品
    text: |-
      刻字、定制尺寸等定制商品不支持七天无理由退货；存在质量问题的，适用 P-QA-01。
    legal_basis:
      - 《中华人民共和国消费者权益保护法》第二十五条

  - id: P-CAT-02
    category: 特殊品类
    title: 生鲜商品
    text: |-
      生鲜商品不支持七天无理由退货；签收后{fresh_report_hours}小时内反馈腐坏、变质等质量问题并提供照片的，商家应当退款。
    params:
      fresh_report_hours: 24  # 待定
    legal_basis:
      - 《中华人民共和国消费者权益保护法》第二十五条

  - id: P-CAT-03
    category: 特殊品类
    title: 激活类电子产品
    text: |-
      手机、平板电脑、电脑等商品激活后，经商品页标注并经消费者下单时确认，不支持七天无理由退货；未激活的不受影响。
      激活后出现质量问题的，适用 P-QA-01。
    legal_basis:
      - 《网络购买商品七日无理由退货暂行办法》第七条
      - 《中华人民共和国消费者权益保护法实施条例》第十九条

  - id: P-CAT-04
    category: 特殊品类
    title: 预售定金
    text: |-
      预售商品的定金在消费者未支付尾款时不予退还；因商家原因无法按约定发货的，商家应当双倍返还定金。
    legal_basis:
      - 《中华人民共和国民法典》第五百八十七条

  # ---------------------------------------------------------------- 客服与纠纷
  - id: P-SVC-01
    category: 客服与纠纷
    title: 身份核实与隐私保护
    text: |-
      客服办理售后前，应当通过注册邮箱或者注册手机号核实消费者身份，只能为本人的订单办理售后。
      客服和商家不得向订单当事人以外的任何人透露订单信息、收货地址和联系方式。
    legal_basis:
      - 《中华人民共和国消费者权益保护法》第二十九条
      - 《中华人民共和国个人信息保护法》第十条
      - 《中华人民共和国电子商务法》第二十三条

  - id: P-SVC-02
    category: 客服与纠纷
    title: 店铺格式条款无效
    text: |-
      商家在商品页或者店铺公告中设置的“不退不换”“签收即视为质量合格”“最终解释权归本店所有”等条款无效，售后按本规则处理。
    legal_basis:
      - 《中华人民共和国消费者权益保护法》第二十六条
      - 《中华人民共和国消费者权益保护法实施条例》第十七条
      - 《最高人民法院关于审理网络消费纠纷案件适用法律若干问题的规定（一）》第一条

  - id: P-SVC-03
    category: 客服与纠纷
    title: 平台介入处理
    text: |-
      消费者与商家协商不成的，可以申请平台介入，平台在{intervene_days}个工作日内作出处理并说明理由。
      平台处理不影响消费者通过投诉、调解、仲裁或者诉讼等途径解决争议。
    params:
      intervene_days: 3  # 待定
    legal_basis:
      - 《中华人民共和国电子商务法》第六十三条
      - 《中华人民共和国电子商务法》第六十条
      - 《网络购买商品七日无理由退货暂行办法》第二十四条
      - 《网络交易平台规则监督管理办法》第三十条

  - id: P-SVC-04
    category: 客服与纠纷
    title: 转人工客服
    text: |-
      智能客服处理售后时，消费者要求人工处理的，应当转人工客服。
      涉及人身损害、欺诈赔偿或者争议金额超过{escalate_amount}元的，必须转人工客服处理。智能客服不得出具法律意见。
      智能客服可以直接办理不超过{auto_refund_limit}元的仅退款和补偿；超过{auto_refund_limit}元、不超过{escalate_amount}元的，提交后先经人工审核再执行。
    params:
      escalate_amount: 1000  # 待定
      auto_refund_limit: 50  # 待定
    legal_basis:
      - 《网络交易平台规则监督管理办法》第十九条

  - id: P-SVC-05
    category: 客服与纠纷
    title: 仅退款的适用范围
    text: |-
      已发货商品的售后原则上为退货退款。
      除商品尚未发货、运输途中丢失或者损毁、商家同意等情形外，平台不强制商家仅退款不退货。
    legal_basis:
      - 《网络交易平台规则监督管理办法》第二十七条

  - id: P-SVC-06
    category: 客服与纠纷
    title: 商家拒绝售后申请
    text: |-
      商家拒绝售后申请的，应当说明理由。消费者对拒绝有异议的，可以申请平台介入（P-SVC-03）；平台认定拒绝理由不成立的，按消费者原来的申请继续处理。
    legal_basis:
      - 《中华人民共和国电子商务法》第六十三条

  - id: P-RISK-01
    category: 客服与纠纷
    title: 售后频繁账户的人工审核
    text: |-
      近{risk_days}天内不退货的退款（仅退款、延迟发货补偿）达到{risk_refunds}次，或者售后申请达到{risk_tickets}次的账户，智能客服受理其仅退款和补偿时，不论金额都先提交人工审核再执行（见 P-SVC-04）。
      风控标识只供平台内部使用，不向消费者展示；消费者询问时，说明账户近期售后申请较多、按平台规则需要人工审核即可。
    params:
      risk_days: 90
      risk_refunds: 2
      risk_tickets: 3
    legal_basis:
      - 《中华人民共和国电子商务法》第三十二条
