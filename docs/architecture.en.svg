marker><marker id="head-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 z" fill="#C8352E"/></marker><marker id="head-red-r" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 12 0 L 0 6 L 12 12 z" fill="#C8352E"/></marker></defs><rect width="2400" height="1380" fill="#FFFFFF"/>
<text x="1200.0" y="64" font-size="44" font-weight="bold" fill="#1F2933" text-anchor="middle">E-commerce Agent System: trained shopping agent + harness-guarded after-sales agent</text>
<rect x="60" y="100" width="1680" height="215" rx="18" fill="#E9F1FB" stroke="#2F6FBA" stroke-width="3"/>
<text x="104" y="142" font-size="34" font-weight="bold" fill="#2F6FBA" text-anchor="start">Shopping</text>
