<text x="1270.0" y="239.0" font-size="20" font-weight="normal" fill="#3A4452" text-anchor="middle">proxies ShopSimulator, records each purchase as an order</text>
<text x="1270.0" y="267.0" font-size="20" font-weight="normal" fill="#3A4452" text-anchor="middle">planned: Buy Now pauses for a confirmation card</text>
