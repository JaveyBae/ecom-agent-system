<text x="570.0" y="612.5" font-size="19" font-weight="normal" fill="#3A4452" text-anchor="middle">Qwen3.5-2B, Claude bridge</text>
<text x="570.0" y="639.5" font-size="19" font-weight="normal" fill="#3A4452" text-anchor="middle">prompt: rules + customer profile</text>
