<text x="2070.0" y="466.0" font-size="22" font-weight="normal" fill="#3A4452" text-anchor="middle">orders · 9 logistics scenarios</text>
<text x="2070.0" y="496.0" font-size="22" font-weight="normal" fill="#3A4452" text-anchor="middle">policy engine (every verdict cites a rule)</text>
<text x="2070.0" y="526.0" font-size="22" font-weight="normal" fill="#3A4452" text-anchor="middle">after-sales flow · manual review</text>
<text x="2070.0" y="556.0" font-size="22" font-weight="normal" fill="#3A4452" text-anchor="middle">merchant rejection · platform intervention</text>
<text x="2070.0" y="586.0" font-size="22" font-weight="normal" fill="#3A4452" text-anchor="middle">work orders · audit log</text>
<text x="2070.0" y="616.0" font-size="22" font-weight="normal" fill="#3A4452" text-anchor="middle">customer memory</text>
