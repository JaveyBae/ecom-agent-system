<text x="440.0" y="201.0" font-size="26" font-weight="bold" fill="#1F2933" text-anchor="middle">Shopping Agent</text>
<text x="440.0" y="239.0" font-size="20" font-weight="normal" fill="#3A4452" text-anchor="middle">Qwen3.5-2B, SFT + GRPO</text>
<text x="440.0" y="267.0" font-size="20" font-weight="normal" fill="#3A4452" text-anchor="middle">in ShopSimulator: search, compare, choose options, buy</text>
