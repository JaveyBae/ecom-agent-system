# 商品类目 → 七天无理由退货的适用情况，对应平台规则 P-RET-02、P-CAT-01～03。
#
# categories 按类目路径前缀匹配（“›”分隔），取匹配最长的一项；没有匹配到的类目适用七天无理由退货。
# 类目名取自 ShopSimulator 商品数据。分类是按常见理解拟定的，不是法律认定。

classes:
  定作:
    kind: 法定不适用        # P-RET-02 第一句，不需要商家标注
    rules: [P-CAT-01, P-RET-02]
  鲜活易腐:
    kind: 法定不适用
    rules: [P-CAT-02, P-RET-02]
  数字化商品:
    kind: 拆封后不适用      # 在线下载或者已拆封的音像制品、计算机软件等
    rules: [P-RET-02]
  食品:
    kind: 确认后不适用      # 商家在商品页标注、消费者下单时确认后才不适用
    rules: [P-RET-02]
  化妆品:
    kind: 确认后不适用
    rules: [P-RET-02]
  个人卫生用品:
    kind: 确认后不适用
    rules: [P-RET-02]
  药品:
    kind: 确认后不适用
    rules: [P-RET-02]
  激活类电子产品:
    kind: 激活后不适用      # 激活并经标注、确认后才不适用
    rules: [P-CAT-03, P-RET-02]

categories:
  全屋定制: 定作
  鲜花速递/花卉仿真/绿植园艺›种子/种苗/球根: 鲜活易腐
  电玩/配件/游戏/攻略›游戏软件: 数字化商品
  粮油调味/速食/干货/烘焙: 食品
  咖啡/麦片/冲饮: 食品
  茶: 食品
  酒类: 食品
  奶粉/辅食/营养品/零食: 食品
  宠物/宠物食品及用品›全价狗主粮: 食品
  宠物/宠物食品及用品›狗零食: 食品
  畜牧/养殖物资›饲料: 食品
  彩妆/香水/美妆工具: 化妆品
  美容护肤/美体/精油: 化妆品
  美发护发/假发›染发烫发: 化妆品
  美发护发/假发›头发护理: 化妆品
  洗护清洁剂/卫生巾/纸/香薰›身体护理: 化妆品
  孕妇装/孕产妇用品/营养›孕产妇护肤/洗护/祛纹: 化妆品
  孕妇装/孕产妇用品/营养›乳房护理（新）: 个人卫生用品
  医疗器械›冲牙器／洗牙器／洁牙机: 个人卫生用品
  医疗器械›助听器: 个人卫生用品
  美发护发/假发›假发: 个人卫生用品
  OTC药品/国际医药: 药品
  畜牧/养殖物资›兽药: 药品
  智能设备: 激活类电子产品

# 商家可以标注“不支持七天无理由退货”的商品里，模拟时有多大比例真的标注了
mark_rate: 0.6

# 耐用商品：签收后 6 个月内的瑕疵由商家举证（P-QA-02）
durable:
  - 大家电
  - 生活电器
  - 厨房电器
  - 影音电器
